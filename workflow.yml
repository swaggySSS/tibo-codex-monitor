name: Tibo Codex Monitor

on:
  schedule:
    # Avoid the busy top of the hour. UTC and Beijing use the same minute values.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = 微信测试；check = 开始/继续监控；preview = 仅预览'
        required: true
        default: check
        type: choice
        options:
          - check
          - test
          - preview

permissions:
  contents: read

concurrency:
  group: tibo-codex-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Run only trusted default-branch code, including when manually triggered.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record trigger
        env:
          MONITOR_SCHEDULE: ${{ github.event.schedule || 'manual' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          lines = [
              "触发方式：" + os.environ["GITHUB_EVENT_NAME"],
              "定时规则：" + os.environ["MONITOR_SCHEDULE"],
              "执行分支：" + os.environ["GITHUB_REF_NAME"],
              "启动时间：" + datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d %H:%M:%S") + " 北京时间（UTC+8）",
          ]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n\n".join(lines) + "\n\n")
          PY
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check public posts or test push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_MODE: ${{ inputs.mode || 'check' }}
          PYTHONUNBUFFERED: '1'
        run: python monitor.py --mode "$MONITOR_MODE"
