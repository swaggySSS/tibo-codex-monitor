name: Tibo Codex Auto Monitor

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnostic = 固定诊断微信；test = 模板测试；check = 监控；preview = 预览'
        required: true
        default: check
        type: choice
        options:
          - check
          - test
          - preview
          - diagnostic
      trigger_source:
        description: '请求来源（调用方声明），用于诊断通知标注'
        required: true
        default: manual
        type: choice
        options:
          - manual
          - cron-job.org

permissions:
  contents: read

concurrency:
  group: tibo-codex-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # GitHub schedules only the default branch; manual runs also require it.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record trigger
        env:
          MONITOR_SCHEDULE: ${{ github.event.schedule || 'manual' }}
          MONITOR_TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          lines = [
              "触发方式：" + os.environ["GITHUB_EVENT_NAME"],
              "请求来源（调用方声明）：" + os.environ["MONITOR_TRIGGER_SOURCE"],
              "定时规则：" + os.environ["MONITOR_SCHEDULE"],
              "执行分支：" + os.environ["GITHUB_REF_NAME"],
              "启动时间：" + datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d %H:%M:%S") + " 北京时间（UTC+8）",
          ]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n\n".join(lines) + "\n\n")
          PY
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check public posts or test push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_MODE: ${{ inputs.mode || 'check' }}
          MONITOR_TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
          PYTHONUNBUFFERED: '1'
        run: python monitor.py --mode "$MONITOR_MODE"
